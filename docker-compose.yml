services:
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    ports:
      - '8080:8080'
    environment:
      # Optional: label the instance so the API/maintenance endpoint can be discovered.
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-}
    volumes:
      - label-studio-data:/label-studio/files
    restart: unless-stopped

volumes:
  label-studio-data:
